name: Build Desktop Applications

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux (debian, fedora, arch, appimage)
          - debian
          - fedora
          - arch

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (NSIS & MSI)
    runs-on: windows-latest
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri Desktop (NSIS & MSI)
        run: pnpm tauri build --bundles nsis,msi

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS (Universal DMG & App)
    runs-on: macos-latest
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri Desktop (Universal DMG & App)
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Package macOS .app archive
        run: |
          tar -czf openapi-editor-macos-app.tar.gz -C src-tauri/target/universal-apple-darwin/release/bundle/macos openapi-editor.app

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS App archive
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-macos-app
          path: openapi-editor-macos-app.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux (Debian, Fedora, AppImage)
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'all' || inputs.target == 'linux (debian, fedora, arch, appimage)' || inputs.target == 'debian' || inputs.target == 'fedora' || inputs.target == 'arch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            patchelf \
            squashfs-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri Desktop (deb, rpm, appimage)
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Upload Debian (.deb) package
        if: ${{ inputs.target == 'all' || inputs.target == 'linux (debian, fedora, arch, appimage)' || inputs.target == 'debian' }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-debian
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Fedora (.rpm) package
        if: ${{ inputs.target == 'all' || inputs.target == 'linux (debian, fedora, arch, appimage)' || inputs.target == 'fedora' }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload AppImage portable bundle
        if: ${{ inputs.target == 'all' || inputs.target == 'linux (debian, fedora, arch, appimage)' }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux compiled release binary (for Arch Linux job)
        if: ${{ inputs.target == 'all' || inputs.target == 'linux (debian, fedora, arch, appimage)' || inputs.target == 'arch' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-binary
          path: src-tauri/target/release/openapi-editor
          if-no-files-found: error
          retention-days: 2

  build-arch:
    name: Build Arch Linux (.pkg.tar.zst)
    needs: build-linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    if: ${{ always() && (inputs.target == 'all' || inputs.target == 'linux (debian, fedora, arch, appimage)' || inputs.target == 'arch') && (needs.build-linux.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux release binary
        uses: actions/download-artifact@v4
        with:
          name: linux-release-binary
          path: downloaded-bin

      - name: Setup Arch Linux builder environment
        run: |
          pacman -Syu --noconfirm base-devel sudo binutils zstd
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder .
          chmod +x packaging/arch/build-arch-package.sh

      - name: Build Arch Linux package
        run: |
          su builder -c "./packaging/arch/build-arch-package.sh downloaded-bin/openapi-editor dist/arch"

      - name: Upload Arch Linux (.pkg.tar.zst) package
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-arch
          path: dist/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      - name: Upload Arch PKGBUILD definition
        uses: actions/upload-artifact@v4
        with:
          name: openapi-editor-arch-pkgbuild
          path: dist/arch/PKGBUILD
          if-no-files-found: error
          retention-days: 14
